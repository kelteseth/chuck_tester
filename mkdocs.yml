site_name: chuck + tester
site_description: AI-driven UI testing for Qt/QML applications
site_url: https://chuck-tester.dev
repo_url: https://github.com/kelteseth/chuck_tester
repo_name: chuck_tester

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: blue grey
    accent: lime
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: blue grey
    accent: lime
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  - navigation.instant
  - navigation.instant.progress
  - navigation.sections
  - navigation.expand
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ""
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.snippets
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
- attr_list
- md_in_html
- tables
- toc:
    permalink: true

plugins:
- search

extra_css:
- stylesheets/extra.css

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/kelteseth/chuck_tester

nav:
- Home: index.md
- Getting Started: getting-started.md
- Tester (C++):
  - Overview: tester/index.md
  - API Reference: tester/api.md
  - Commands: tester/commands.md
  - QML Best Practices: tester/qml-practices.md
- Chuck (Python):
  - Overview: chuck/index.md
  - Client API: chuck/api.md
  - CLI Reference: chuck/cli.md
  - MCP Server: chuck/mcp.md
- Testing Guide:
  - Writing Tests: guide/writing-tests.md
  - Synchronization: guide/synchronization.md
  - Visual Testing: guide/visual-testing.md
  - Recording & Replay: guide/recording.md
  - AI Repair: guide/ai-repair.md
- Examples:
  - Todo App: examples/todoapp.md
