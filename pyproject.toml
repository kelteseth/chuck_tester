[project]
name = "chuck-tester-workspace"
version = "0.0.0"
description = "Workspace root for running chuck tests"
requires-python = ">=3.12"
dependencies = [
    "chuck",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7",
]

[tool.uv.sources]
chuck = { path = "chuck", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
