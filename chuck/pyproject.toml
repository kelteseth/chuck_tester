[project]
name = "chuck"
version = "0.1.0"
description = "Python controller for chuck_tester — AI-driven Qt/QML testing"
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-EliasSteurerTachiom"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15.0",
    "Pillow>=10.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[project.scripts]
chuck = "chuck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
